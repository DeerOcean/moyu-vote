被問進度就說『卡在等別部門回覆』，球永遠在別人那", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0383", "text": "耳機戴著但沒放音樂，這樣聽得到八卦又能裝沒空", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0384", "text": "桌上放一杯永遠喝不完的咖啡，象徵你一直很忙", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0385", "text": "電梯按到別層先出去走一圈，回座的路越長越好", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0386", "text": "群組訊息先按愛心，表示我有看，但我不一定要做", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0387", "text": "把難的工作排在下午三點，因為三點以後沒人想認真", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0388", "text": "列出待辦清單花二十分鐘，做事花五分鐘，清單就是工作", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0389", "text": "印表機卡紙是天賜的休息，修個十分鐘很合理", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0390", "text": "開視訊把鏡頭關掉，理由永遠是『我網路不太穩』", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0391", "text": "假裝去找同事討論，討論到一半就聊去週末要幹嘛", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0392", "text": "報告檔案存一堆版本，光是命名v7就顯得你很拼", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0393", "text": "主管問在忙嗎，標準答案是『還好，但等等有個東西要交』", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0394", "text": "下班前十分鐘是發呆黃金期，這時候動工是對自己殘忍", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0395", "text": "把水壺裝小一點，這樣一天要去裝水五六次", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0396", "text": "開個word打一行字，alt+tab回去之後沒人知道你寫了啥", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0397", "text": "裝忙最高境界是嘆氣，嘆得夠大聲就沒人敢丟事給你", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0398", "text": "被cc的信一律當沒看到，cc就是『干你屁事但通知你一下』", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0399", "text": "午睡趴下前把滑鼠墊在手肘，這樣手不會麻醒得太快", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0400", "text": "開檔案前先泡杯茶，泡完茶就忘記要開什麼了，剛好", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0401", "text": "電話響先讓它響兩聲，太快接顯得你太閒沒事做", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0402", "text": "把訂便當的任務攬下來，這樣有三十分鐘可以光明正大不工作", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0403", "text": "開會前先說『我先去上個廁所』，回來會議都進行一半了", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0404", "text": "資料整理是萬用藉口，整理一整天等於合法摸一整天", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0405", "text": "把難搞的客戶mail放到明天，明天的你會比今天更勇敢（騙人的）", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0406", "text": "螢幕保護程式設一分鐘，這樣離座再回來都像剛開始工作", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0407", "text": "被問會不會就說『我看看喔』，看一輩子都還在看", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0408", "text": "早上花半小時規劃今天，規劃完就累了，先休息一下", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0409", "text": "接到電話站起來講，邊講邊走出去，順便放風十分鐘", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0410", "text": "鍵盤放一張便利貼寫『開發中』，貼著就沒人敢來吵", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0411", "text": "檔案傳給同事後說『你先看，有問題再喊我』，球漂亮地交出去", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0412", "text": "上午是用來進入狀況的，真正開工請從下午算起", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0413", "text": "把『等等回你』設成罐頭訊息，按一下就買到半小時自由", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0414", "text": "開大檔案的時候是法定休息時間，電腦在跑你就在歇", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0415", "text": "主管問完話點頭走人，回座位先消化一下情緒，消化半小時", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0416", "text": "故意把筆掉到地上，撿筆的三秒鐘是屬於你的小小放空", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0417", "text": "今天能丟給明天的，絕不留到今天下午", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0418", "text": "開會記筆記其實是在畫格子，畫滿一頁等於認真一場", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0419", "text": "把座位調到背對門口，誰進來你都有兩秒切畫面的緩衝", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0420", "text": "訊息回『收到，安排一下』，安排到下個月都還在安排", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0421", "text": "印一疊看起來很重要的紙拿在手上，走到哪都像在辦正事", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0422", "text": "中午吃飽走最遠那條路回公司，消化食物也消化工時", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0423", "text": "被交代事情先問三個問題，問著問著對方自己就做掉了", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0424", "text": "電腦故意開十個分頁，當機重開又能合理摸魚十五分鐘", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0425", "text": "開個記事本假裝抄重點，其實在列今晚想吃的宵夜", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0426", "text": "接近下班絕不開新檔案，開了就要對未來的自己負責", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0427", "text": "群組有人問問題，等別人先回，你再補一句『對對對』", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0428", "text": "把『正在處理』掛在嘴邊，處理的速度由你的心情決定", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0429", "text": "開冷氣理由去調溫度，順便在中央走道散步一圈", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0430", "text": "早會發言搶在前面講完，後面就能安心放空整場", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0431", "text": "資料夾深處藏一個遊戲，但你絕不會玩，光是知道它在就很爽", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0432", "text": "被丟急件先說『我手上這個快好了』，快好了是一種永恆狀態", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0433", "text": "列印機在另一層樓的話，那層樓的廁所順便也歸你管", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0434", "text": "螢幕貼防窺片，這樣摸魚是你的隱私，神聖不可侵犯", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0435", "text": "開會帶筆電進去，誰知道你螢幕上是會議紀錄還是購物車", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0436", "text": "郵件草稿夾存十封寫一半的信，看起來你欠了世界很多努力", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0437", "text": "被問為什麼還沒好，就說『我想做得更完整一點』，沒人能反駁完整", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0438", "text": "早上打卡完先去買早餐，吃完早餐才是真正的開機", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0439", "text": "同事問你忙不忙，永遠回『還行』，太閒會被加碼太忙會被同情", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0440", "text": "把回覆時間刻意拉長到傍晚，這樣對方明天才會追，又賺一天", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0441", "text": "開個試算表亂拉幾條公式，畫面越複雜越沒人想打擾你", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0442", "text": "中午睡醒先發呆五分鐘，叫醒大腦也是工作的一環", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0443", "text": "被指派任務先說『我評估一下時程』，評估本身就是一種拖", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0444", "text": "印錯的紙不要丟，留著當『我有在做事』的物證", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0445", "text": "電梯等到坐滿才上，多等的那幾趟都是合法的偷時間", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0446", "text": "把手機調靜音放正面朝上，這樣不用拿起來就知道誰在找你，懶得回", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0447", "text": "今天的會議結束就是今天的工作結束，剩下的是溫存時間", "meta": "AI · 技巧", "tags": ["技巧"], "url": ""}, {"id": "q0448", "text": "被你釣到算你厲害，但我本來也不想動", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0449", "text": "我在水裡躺平很久了，換個地方躺而已", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0450", "text": "別期待我掙扎，我連逃跑都嫌累", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0451", "text": "鉤子來的時候我正在發呆，順便就上來了", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0452", "text": "游泳？太累了，我都用漂的", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0453", "text": "水裡沒訊號，剛好不用回別人", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0454", "text": "我不是被釣，是出來透透氣", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0455", "text": "上岸看看也好，反正水裡也沒在忙", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0456", "text": "我這條魚，主打一個隨緣", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0457", "text": "餌我看到了，只是懶得拒絕", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0458", "text": "動一下就餓，所以我盡量不動", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0459", "text": "我的人生目標就是維持現在這樣躺著", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0460", "text": "魚生苦短，能飄就不游", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0461", "text": "剛剛那口不是貪吃，是想換個地方睡", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0462", "text": "被撈起來也好，省得我自己浮上來", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0463", "text": "我沒有夢想，我只有水草和午睡", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0464", "text": "努力的魚都游走了，我留下來看家", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0465", "text": "我不迴游，我就賴在這條河", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0466", "text": "別人逆流而上，我順流而躺", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0467", "text": "咬餌只是手滑，嘴滑", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0468", "text": "我這輩子最大的運動就是被你拉上來", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0469", "text": "水溫剛好，誰想離開被窩", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0470", "text": "我擺尾不是在游，是在伸懶腰", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0471", "text": "魚群往東，我往躺", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0472", "text": "上鉤前我考慮了三秒，主要是懶得考慮", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0473", "text": "我不是慢，我是在享受每一寸水", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0474", "text": "再等等，我這攤泥還沒躺暖", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0475", "text": "我浮在水面不是在曬，是在放空", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0476", "text": "逃跑要計畫，計畫好累，算了", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0477", "text": "我的座右銘是：先躺著再說", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0478", "text": "你釣到的不是魚，是一團不想動的水", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0479", "text": "我連張嘴都嫌費力，餌自己飄進來的", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0480", "text": "早上的魚很拼，我是下午班的", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0481", "text": "漂著漂著就到你這了，緣分", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0482", "text": "我不追餌，餌追我我才考慮", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0483", "text": "水裡也要排隊找好位置躺，累死", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0484", "text": "我這條，鹹魚都嫌我太鹹", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0485", "text": "別搖了，我下來不是因為驚慌，是因為睏", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0486", "text": "我擅長的是裝死，逃命是次要技能", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0487", "text": "被釣上來這件事，我已讀不回很久了", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0488", "text": "水流幫我移動，我只負責閉眼", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0489", "text": "我不是沉底，我是低調躺平", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0490", "text": "今天的浮游生物，我一個都不想追", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0491", "text": "我游得慢是因為趕時間沒意義", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0492", "text": "我跟海帶的差別，就是我偶爾眨眼", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0493", "text": "釣竿那麼用力，我都不好意思掙扎", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0494", "text": "我這嘴張開只為打哈欠，不為咬餌", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0495", "text": "與其找食物，不如等食物找我", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0496", "text": "我泡在水裡，跟泡在被窩沒兩樣", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0497", "text": "上來看看天氣，發現還是適合躺", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0498", "text": "忙碌的魚都長肌肉，我長的是肚子", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0499", "text": "別問我要去哪，我哪都不想去", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0500", "text": "魚有魚的步調，我的步調是停著", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0501", "text": "咬鉤前我打了個盹，醒來就上岸了", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0502", "text": "我不是逆來順受，我是懶來順受", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0503", "text": "水草都比我有事做", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0504", "text": "我這一生，浮過、沉過、躺最多", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0505", "text": "逃跑那麼喘，不如體面地被你撈", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0506", "text": "我的能量條，永遠卡在剛起床那格", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0507", "text": "別誇我穩，我只是懶得動而已", "meta": "AI · 口頭禪", "tags": ["口頭禪"], "url": ""}, {"id": "q0508", "text": "我不挑水域，能躺的地方都是我家", "meta": "AI · 一句\n/丟 → 把你看到或想到的丟進池子（要選來源：手寫／AI 協助／AI 生成／轉貼別人的附連結）\n/我的卡 → 看你丟的東西被抽了幾次、幾個人笑了\n\n被撈起來會發生什麼：好的卡會被畫出來、掛你的名、進遊戲圖鑑、發去 Threads——見 #撈起來了。\n只有手寫的能掛名進圖鑑；AI 生成的進審稿池，過關才畢業；轉貼的一律附原作者。\n\n想釣魚：#釣魚 打 /釣魚。\n\n第 0 期（到 __月__日）入教的前 30 位＝創教元老，名字會留在這裡：\n- （名單）", "meta": "#入教須知 釘文（已貼，改了我重貼）", "tags": ["discord"], "url": ""}, {"id": "announce", "text": "這裡多了一個分區「摸魚諧教」：一個把梗、句子、連結丟進去、抽出來、按笑了的小玩具，好的會被畫成魚進圖鑑。楓星那邊照舊。想玩去 #入教須知 看三行說明就會了。第 0 期入教的前 30 位算創教元老。", "meta": "公告一則（教主自己貼在閒聊區）", "tags": ["discord"], "url": ""}, {"id": "topic_rules", "text": "摸魚諧教是什麼、怎麼玩（三個指令）、來源申報、創教元老名單。唯讀。", "meta": "#入教須知 頻道說明", "tags": ["discord"], "url": ""}, {"id": "topic_draw", "text": "只用斜線指令：/抽 抽一張卡、/丟 丟東西進池子、/我的卡 看被抽幾次。討論按卡上「我也說一句」，閒聊去閒聊大廳。", "meta": "#抽梗 頻道說明", "tags": ["discord"], "url": ""}, {"id": "topic_fish", "text": "摸魚人生遊戲本體：/釣魚 /地圖 /前往 /魚塘 /賣魚 /圖鑑 /情報。播報也在這。", "meta": "#釣魚 頻道說明", "tags": ["discord"], "url": ""}, {"id": "topic_harvest", "text": "被撈起來的卡：畫出來、掛名、進圖鑑、發去 Threads。只有教主發，大家可以按反應。", "meta": "#撈起來了 頻道說明", "tags": ["discord"], "url": ""}, {"id": "btn_labels", "text": "😆 笑了 ／ 😐 沒感覺 ／ 🎲 再抽 ／ ✍️ 我也說一句 ／ ⭐ 收藏 ／ 🚩 檢舉", "meta": "/抽 卡片按鈕文字", "tags": ["bot"], "url": ""}, {"id": "roles", "text": "教徒 ／ 創教元老 ／ 經文作者 ／ 教主", "meta": "身分組名稱", "tags": ["discord"], "url": ""}]}];
const $=id=>document.getElementById(id);
let voter=localStorage.getItem("moyu_voter")||"";
let st=JSON.parse(localStorage.getItem("moyu_text_review")||"{}"); // key col:id -> {text,status,note,sent:{...}}
function key(c,i){return c+":"+i}
function save(){localStorage.setItem("moyu_text_review",JSON.stringify(st));}
function rec(c,i){ st[key(c,i)]=st[key(c,i)]||{}; return st[key(c,i)]; }
async function post(col,id,field,value,status,note){
  if(!API) return;
  const clean=v=>String(v||"").replace(/ \| /g," ｜ ");
  const body={ts:Date.now(),voter,type:"text_review",image:col,winner:id,loser:status||"",pair:[field,clean(value),clean(note)]};
  try{ await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}); }catch(e){}
}
let cur=DATA[0].key, q="", onlyOpen=false, tagf="", shown=60;
function render(){
  const col=DATA.find(c=>c.key===cur); $("hint").textContent=col.hint;
  const tags=[...new Set(col.items.flatMap(i=>i.tags||[]))].filter(Boolean).sort();
  $("tag").innerHTML="<option value=''>全部標籤</option>"+tags.map(t=>`<option ${t===tagf?'selected':''}>${t}</option>`).join("");
  const ql=q.trim().toLowerCase();
  let items=col.items.filter(i=>(!ql || (i.text+" "+i.meta).toLowerCase().includes(ql)) && (!tagf || (i.tags||[]).includes(tagf)) && (!onlyOpen || !(rec(cur,i.id).status)));
  const cnt={keep:0,edit:0,del:0,ask:0,open:0};
  for(const i of col.items){ const s=rec(cur,i.id).status; if(s) cnt[s]=(cnt[s]||0)+1; else cnt.open++; }
  $("cnt").textContent=`本頁 ${col.items.length}｜✅${cnt.keep} ✏️${cnt.edit} ❌${cnt.del} ❓${cnt.ask}｜未批 ${cnt.open}｜符合篩選 ${items.length}`;
  const root=$("list"); root.innerHTML="";
  items.slice(0,shown).forEach(i=>{
    const r=rec(cur,i.id); const div=document.createElement("div"); div.className="row"+(r.status?" st-"+r.status:"");
    const text=r.text!==undefined?r.text:i.text;
    div.innerHTML=`<div class="meta"><span>${esc(i.meta)}${i.url?` · <a href="${esc(i.url)}" target="_blank">原文</a>`:""}</span><span class="sync">${r.status||""}</span></div>
      <textarea data-k="${esc(i.id)}" class="${r.text!==undefined&&r.text!==i.text?'changed':''}">${esc(text)}</textarea>
      <div class="acts">
        <button class="keep ${r.status==='keep'?'on':''}" data-s="keep">✅ 留</button>
        <button class="edit ${r.status==='edit'?'on':''}" data-s="edit">✏️ 改了</button>
        <button class="del ${r.status==='del'?'on':''}" data-s="del">❌ 刪</button>
        <button class="ask ${r.status==='ask'?'on':''}" data-s="ask">❓ 待議</button>
        <input class="note ${r.noteSent&&r.noteSent===r.note?'saved':''}" placeholder="批閱建議／怎麼改／為什麼" value="${esc(r.note||'')}">
      </div>`;
    const ta=div.querySelector("textarea"); const auto=()=>{ta.style.height="auto";ta.style.height=(ta.scrollHeight+2)+"px"}; setTimeout(auto,0);
    let t=null;
    ta.addEventListener("input",()=>{ auto(); r.text=ta.value; ta.classList.toggle("changed",ta.value!==i.text); if(ta.value!==i.text && !r.status){ r.status="edit"; } save(); clearTimeout(t); t=setTimeout(()=>{ post(cur,i.id,"text",ta.value,r.status,r.note); },1500); });
    ta.addEventListener("blur",()=>{ clearTimeout(t); if(r.text!==undefined && r.text!==i.text) post(cur,i.id,"text",r.text,r.status,r.note); });
    div.querySelectorAll(".acts button").forEach(b=>b.addEventListener("click",()=>{ r.status=(r.status===b.dataset.s?"":b.dataset.s); save(); post(cur,i.id,"status",r.text!==undefined?r.text:i.text,r.status,r.note); render(); }));
    const nt=div.querySelector(".note"); let t2=null;
    nt.addEventListener("input",()=>{ r.note=nt.value; nt.classList.remove("saved"); save(); clearTimeout(t2); t2=setTimeout(()=>{ post(cur,i.id,"note",r.text!==undefined?r.text:i.text,r.status,r.note); r.noteSent=r.note; save(); nt.classList.add("saved"); },1500); });
    nt.addEventListener("blur",()=>{ clearTimeout(t2); if(r.note && r.noteSent!==r.note){ post(cur,i.id,"note",r.text!==undefined?r.text:i.text,r.status,r.note); r.noteSent=r.note; save(); nt.classList.add("saved"); } });
    root.appendChild(div);
  });
  if(items.length>shown){ const b=document.createElement("button"); b.className="more"; b.textContent=`再顯示 60 條（還有 ${items.length-shown}）`; b.onclick=()=>{shown+=60;render();}; root.appendChild(b); }
}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
$("tabs").innerHTML=DATA.map(c=>`<span class="tab ${c.key===cur?'on':''}" data-k="${c.key}">${c.name} <small>${c.items.length}</small></span>`).join("");
$("tabs").querySelectorAll(".tab").forEach(t=>t.onclick=()=>{cur=t.dataset.k;shown=60;tagf="";$("tabs").querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.k===cur));render();});
$("q").addEventListener("input",e=>{q=e.target.value;shown=60;render();});
$("tag").addEventListener("change",e=>{tagf=e.target.value;shown=60;render();});
$("open").addEventListener("change",e=>{onlyOpen=e.target.checked;shown=60;render();});
$("nameOk").onclick=()=>{ voter=($("nameInput").value.trim())||("匿名"+Math.floor(Math.random()*1000)); localStorage.setItem("moyu_voter",voter); $("name").classList.remove("show"); };
if(!voter) $("name").classList.add("show");
render();
</script>
