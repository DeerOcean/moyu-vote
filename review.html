<script>
const API=window.VOTE_API||null; const DATA=[{"key": "cards", "name": "卡池種子", "hint": "191 張：148 真語料＋17 hashtag 爆文＋26 魚卡。改文字＝改卡面；建議寫在批閱欄。", "items": [{"id": "card_000", "text": "新人：「學姊，工作做完了，可以準時下班嗎？」\n我：「不要問，不要聲張。時間到了，電腦關了，人就消失。走得越安靜，路才走得越長遠。」", "meta": "real_other · today.is.off · 👍48536 · 職場", "tags": ["職場"], "url": "https://www.threads.net/@today.is.off/post/DQilUBSAWtT"}, {"id": "card_001", "text": "剛剛工作壓力很大，\n但我突然想到一件事，我就釋懷了。\n再過 100 年，\n現在這間公司倒了，\n老闆不在了，\n我也變成灰了。\n根本沒有人會記得，\n我在 2026 年的某個禮拜一，\n有一封 Email 忘記回。\n所以在宇宙的長河裡，\n我今天的這點失誤，\n連一顆灰塵都算不上。\n想通了。\n準時下班。", "meta": "real_other · lucian_h2 · 👍27427 · 職場", "tags": ["職場"], "url": "https://www.threads.net/@lucian_h2/post/DTZ87gzFOSQ"}, {"id": "card_002", "text": "上班族爭分奪秒的午休！車裡躺平太舒服了😂", "meta": "real_other · junjie_happyshare · 👍82135 · 耍廢/職場", "tags": ["耍廢", "職場"], "url": "https://www.threads.net/@junjie_happyshare/post/DXGUtk2gDZk"}, {"id": "card_003", "text": "我陪我女朋友。\n\n她週末會坐在窗邊發呆兩小時。\n\n我以為這人也太閒。\n\n後來才發現，全家最不焦慮的就是她。", "meta": "real_other · sousanminimal · 👍34041 · 耍廢", "tags": ["耍廢"], "url": "https://www.threads.net/@sousanminimal/post/DXL3FRrEr5_"}, {"id": "card_004", "text": "情侶在一起久了\n最厲害的不是多會聊天\n是可以什麼都不做 還能待很久\n\n一個滑手機 一個發呆\n然後突然說：欸 你看這個\n\n就夠了", "meta": "real_other · _tick_888 · 👍34130 · 耍廢", "tags": ["耍廢"], "url": "https://www.threads.net/@_tick_888/post/DZXj70bD5mH"}, {"id": "card_005", "text": "誰懂做餐飲下班都需要發呆30分鐘\n沒為什麼，就真的放空", "meta": "real_other · i4yy_0105 · 👍18344 · 耍廢/職場", "tags": ["耍廢", "職場"], "url": "https://www.threads.net/@i4yy_0105/post/DY_fTqkErzZ"}, {"id": "card_006", "text": "開會時，主管講得熱烈，我點頭如搗蒜。\n看似認真，其實心裡在想：\n「晚餐要吃滷肉飯還是牛肉麵？」\n\n直到他突然點名：「你覺得呢？」\n我瞬間回神，腦子空白三秒，脫口而出：\n「我覺得可以再觀察。」\n\n結果全場點頭。\n原來職場的萬用回答，不是專業，而是模糊。", "meta": "real_other · workmeme_ · 👍17463 · 職場", "tags": ["職場"], "url": "https://www.threads.net/@workmeme_/post/DOxr2UfAHFA"}, {"id": "card_007", "text": "記錄一下可憐的研究生們\n準備通宵 啊我只是在加熱時間\n絕對沒有偷懶💩\n要不要來當我們同學啊😉\n化工", "meta": "real_other · xinjung1124 · 👍9447 · 耍廢", "tags": ["耍廢"], "url": "https://www.threads.net/@xinjung1124/post/C53gcB3y5Nz"}, {"id": "card_008", "text": "到底是誰創了這個app啦\n我真的我會笑屎🤣🤣🤣🤣🤣\n帶薪拉💩", "meta": "real_other · ccc_hsuan_ · 👍4740 · 語錄", "tags": ["語錄"], "url": "https://www.threads.net/@ccc_hsuan_/post/DWn0clBmdyZ"}, {"id": "card_009", "text": "每天上班蹲馬桶十分鐘\n一年多賺五天多的帶薪拉屎假", "meta": "real_other · adersaytech · 👍926 · 職場", "tags": ["職場"], "url": "https://www.threads.net/@adersaytech/post/DIgxwAJynu0"}, {"id": "card_010", "text": "剛出社會的時候，當時的同事姐姐告訴我\n:偷懶想不被發現的話，要皺眉頭盯著螢幕，然後偶爾突然嘆氣\n到現在工作兩年了，我依舊貫徹如此...", "meta": "real_other · ouopyllpoz · 👍606 · 耍廢/職場", "tags": ["耍廢", "職場"], "url": "https://www.threads.net/@ouopyllpoz/post/DZd8IGsEhuK"}, {"id": "card_011", "text": "冷知識：\n\n上班後你會發現\n這兩種人最容易把你搞到想離職\n\t1.\t裝忙的人\n\t2.\t裝忙還來煩你的人", "meta": "real_other · wen931112 · 👍7369 · 職場", "tags": ["職場"], "url": "https://www.threads.net/@wen931112/post/DRcM4R3kleK"}, {"id": "card_012", "text": "振作點啊！你會不會太軟爛了一點\n幾分鐘前才剛羽化就直接躺平（？\n明天把你丟回山上會不會直接被天擇掉🫠", "meta": "real_other · cynical_arte · 👍7977 · 耍廢", "tags": ["耍廢"], "url": "https://www.threads.net/@cynical_arte/post/DXTsmR9k-k8"}, {"id": "card_013", "text": "不覺得午休一打鐘就馬上開燈大聲講話的很靠腰嗎", "meta": "real_other · 6_xyy4 · 👍16163 · 語錄", "tags": ["語錄"], "url": "https://www.threads.net/@6_xyy4/post/DVf0jsnk3cz"}, {"id": "card_014", "text": "職場潛規則：能者多勞，不能者摸魚。\n\n只要你工作能力強，\n事情會越來越多，\n最後變成整組的救火隊。\n\n但有些人就算只做了一點點，\n還是能準時下班。\n\n這種不公平的事，你遇過嗎？", "meta": "real_other · guan_yu31 · 👍3809 · 摸魚/職場", "tags": ["摸魚", "職場"], "url": "https://www.threads.net/@guan_yu31/post/DGV1GipyEQu"}, {"id": "card_015", "text": "能力越差的主管，越會做的三件事：\n1️⃣ 愛開會\n2️⃣ 情緒化\n3️⃣ 在很忙的時候突然來亂", "meta": "real_other · littlemchan · 👍10446 · 職場", "tags": ["職場"], "url": "https://www.threads.net/@littlemchan/post/DUiKyEDE8cB"}, {"id": "card_016", "text": "前陣子在外面開會，聽到一位老前輩在教他的下屬改回信\n\n他說：「你信裡面不要寫『我覺得』，也不要寫『我建議』，這種話寫進去都是在給自己找麻煩。」\n\n下屬愣了一下，問他那要怎麼寫。\n前輩喝了口咖啡，語氣很淡：\n「你要寫『根據上次會議的共識』，或者是『按照過往的執行慣例』。」\n\n「你要記住，把『我』拿掉，事情出錯的時候，就沒有人需要負責。到時候是『共識』錯了，或者是『慣例』不適用了，絕對不是你錯了。」", "meta": "real_other · leoman0512 · 👍37288 · 職場", "tags": ["職場"], "url": "https://www.threads.net/@leoman0512/post/DXvOdXimaj-"}, {"id": "card_017", "text": "你信不信人一旦沒有了工作，就會選擇在家裡躺平。\n\n越閒越懶，越躺越廢。晚上睡不著，白天躺到自然醒\n作息不規律，有時候一天只吃一頓飯\n起來不是滑手機就是打遊戲。\n\n慢慢的越來越不想去工作了\n越來越迷茫，不願意社交，不願意出門，陷入自我內耗的死循環。\n\n這是不是當代上班族的真實現狀？", "meta": "real_other · adian_919 · 👍10819 · 耍廢/職場", "tags": ["耍廢", "職場"], "url": "https://www.threads.net/@adian_919/post/DZFL8mbEmXD"}, {"id": "card_018", "text": "「下班後真的好累，什麼事都不想做」的心情，真的只有上班後才能體會。\n\n那種累是很莫名其妙的累ㄟ⋯⋯", "meta": "real_other · luckylulu0212 · 👍8571 · 職場", "tags": ["職場"], "url": "https://www.threads.net/@luckylulu0212/post/DC1ioXzT7RY"}, {"id": "card_019", "text": "待業久了 → 經濟壓力大\n找到工作 → 開始上班 → 好累只想躺平\n這人生循環真的無解欸 🤯 煩～～\n\n有人跟我一樣嗎？🙋‍♀️", "meta": "real_other · designer.lin20290fire · 👍1868 · 耍廢/職場", "tags": ["耍廢", "職場"], "url": "https://www.threads.net/@designer.lin20290fire/post/DOvfeLrE2gq"}, {"id": "card_020", "text": "午安~❤️ 人在上班心在玩 ヽ(✿ﾟ▽ﾟ)ノ #今天的空氣好清新 #世界充滿了希望", "meta": "real_other · 麻糬爸與白爛貓家族 @mochi_dad（IG 391K 粉） · 👍7900 · 職場", "tags": ["職場"], "url": "https://www.instagram.com/p/BZ5leyHAFsR/"}, {"id": "card_021", "text": "廢癌末期 (▰˘◡˘▰)", "meta": "real_other · 麻糬爸與白爛貓家族 @mochi_dad · 👍18200 · 耍廢", "tags": ["耍廢"], "url": "https://www.instagram.com/p/CGfGJzHnnsH/"}, {"id": "card_022", "text": "晚安~❤️ 拜託你知道這種成就有多難達到嗎?╮(╯▽╰)╭ #我廢我驕傲", "meta": "real_other · 麻糬爸與白爛貓家族 @mochi_dad · 👍6100 · 耍廢", "tags": ["耍廢"], "url": "https://www.instagram.com/p/BNhaG2CD8F0/"}, {"id": "card_023", "text": "✨開✨工✨大✨吉✨ 數日子是撐下去的動力來源🙄🙄 #剛開工就想著收工 #其實一直都是這種心情", "meta": "real_other · 麻糬爸與白爛貓家族 @mochi_dad · 👍8800 · 語錄", "tags": ["語錄"], "url": "https://www.instagram.com/p/BP_fM_gjL6o/"}, {"id": "card_024", "text": "我很閒。", "meta": "real_other · 消極男子 @mainasu_com（IG 133K 粉） · 👍1292 · 語錄", "tags": ["語錄"], "url": "https://www.instagram.com/p/DWlYehNjxrn/"}, {"id": "card_025", "text": "在鬧鐘響之前，我應該是自由的", "meta": "real_other · 消極男子 @mainasu_com · 👍1291 · 語錄", "tags": ["語錄"], "url": "https://www.instagram.com/p/DW0X1JukkDx/"}, {"id": "card_026", "text": "如果沒有冷氣，就趕快離職", "meta": "real_other · 消極男子 @mainasu_com · 👍6747 · 職場", "tags": ["職場"], "url": "https://www.instagram.com/p/DY3lgHXD1cP/"}, {"id": "card_027", "text": "上班我就是公司的走狗\n下班公司就不要找我，拜託", "meta": "real_other · 消極男子 @mainasu_com · 👍1569 · 職場", "tags": ["職場"], "url": "https://www.instagram.com/p/DYOYsFNDlbT/"}, {"id": "card_028", "text": "人怎麼可以同時又忙又窮？", "meta": "real_other · 消極男子 @mainasu_com · 👍1945 · 語錄", "tags": ["語錄"], "url": "https://www.instagram.com/p/DSbmNIdEk1P/"}, {"id": "card_029", "text": "什麼品質的飼料就養什麼品質的牛馬", "meta": "real_other · 消極男子 @mainasu_com · 👍1841 · 語錄", "tags": ["語錄"], "url": "https://www.instagram.com/p/DUCl6XZkkVU/"}, {"id": "card_030", "text": "不幸的話，就會活得又累又窮又久", "meta": "real_other · 消極男子 @mainasu_com · 👍4757 · 語錄", "tags": ["語錄"], "url": "https://www.instagram.com/p/DRJMw4mjvN0/"}, {"id": "card_031", "text": "生而為人，我很厭世", "meta": "real_other · 厭世姬（厭世動物園） · 👍0 · 語錄", "tags": ["語錄"], "url": "https://readmoo.com/book/210068621000101"}, {"id": "card_032", "text": "我就爛", "meta": "real_other · LINE 貼圖圈流行語（2020 Q1，多組貼圖採用） · 👍0 · 語錄", "tags": ["語錄"], "url": "https://www.mirrormedia.mg/story/20201222insight001/"}, {"id": "card_033", "text": "可是我不想努力了", "meta": "real_other · LINE 貼圖圈流行語（2020 Q4，多組貼圖採用） · 👍0 · 語錄", "tags": ["語錄"], "url": "https://www.mirrormedia.mg/story/20201222insight001/"}, {"id": "card_034", "text": "修但幾勒", "meta": "real_other · LINE 貼圖圈流行語（2020 Q1，台語「等一下」） · 👍0 · 語錄", "tags": ["語錄"], "url": "https://www.mirrormedia.mg/story/20201222insight001/"}, {"id": "card_035", "text": "性格太廢沒有不好，只是這個社會步調太快", "meta": "real_other · Jing（柴語錄 SHIBA SAYS，IG 708K 粉） · 👍0 · 耍廢", "tags": ["耍廢"], "url": "https://www.toyselect.me/pages/shiba-says"}, {"id": "card_036", "text": "柴語錄解答之書【隨書贈送「有點廢」貼紙+全彩PVC透卡2款，許願柴富自由不上班】", "meta": "real_other · Jing（柴語錄） · 👍0 · 耍廢/職場", "tags": ["耍廢", "職場"], "url": "https://www.bookrep.com.tw/?md=gwindex&cl=book&at=bookcontent&id=19590"}, {"id": "card_037", "text": "今天也是充滿希望的一天，希望 ags": ["語錄"], "url": "https://zhuanlan.zhihu.com/p/268597560"}, {"id": "card_048", "text": "只要我够努力，老板一定会过上他想要的生活！早安打工人！", "meta": "real_other · 佚名（社交平台流傳） · 👍0 · 語錄", "tags": ["語錄"], "url": "https://www.ifanr.com/1374723"}, {"id": "card_049", "text": "我是一个保安，上班为了下班", "meta": "real_other · 抽象文化圈（带篮子相關名梗） · 👍0 · 職場", "tags": ["職場"], "url": "https://m.thepaper.cn/newsDetail_forward_9679774"}, {"id": "card_050", "text": "生活里80%的痛苦来源于打工 但是我知道 如果不打工 就会有100%的痛苦来源于没钱 所以在打工和没钱之间 我选择打工", "meta": "real_other · 佚名（打工人語錄） · 👍0 · 語錄", "tags": ["語錄"], "url": "https://pub.timedg.com/s/2020-10/27/AP610e8836e4b0a86f2ebe4801.html"}, {"id": "card_051", "text": "你好，摸鱼人！工作再忙，一定不要忘记摸鱼哦！有事没事起身去茶水间，去厕所，去走廊走走，去找同事聊聊八卦！别老在工位上坐着，钱是老板的，但命是自己的。", "meta": "real_other · 佚名（摸魚辦通知模板；句中emoji已略） · 👍0 · 職場", "tags": ["職場"], "url": "https://moyu.liuxin.online/"}, {"id": "card_052", "text": "一时摸鱼一时爽，一直摸鱼一直爽", "meta": "real_other · 佚名（網路俗語） · 👍0 · 語錄", "tags": ["語錄"], "url": "https://www.sohu.com/a/471649569_121119529"}, {"id": "card_053", "text": "如果上班不是为了摸鱼，那将毫无意义。", "meta": "real_other · 裴逸 · 👍0 · 職場", "tags": ["職場"], "url": "https://juejin.cn/pin/6979405015622352910"}, {"id": "card_054", "text": "在上班和上进之间，年轻人选择了上香", "meta": "real_other · 佚名（網路熱梗，媒體定型） · 👍0 · 職場", "tags": ["職場"], "url": "https://news.qq.com/rain/a/20230323A03PJZ00"}, {"id": "card_055", "text": "事已至此，先吃饭吧", "meta": "real_other · 源自電影《小森林》台詞＋電競圈「先点菜吧」演變 · 👍0 · 語錄", "tags": ["語錄"], "url": "https://www.zhihu.com/question/343473336"}, {"id": "card_056", "text": "没错妈妈，人生是旷野哦", "meta": "real_other · 伯恩山犬bot · 👍0 · 語錄", "tags": ["語錄"], "url": "https://zh.moegirl.org.cn/zh-hans/%E4%BA%BA%E7%94%9F%E6%98%AF%E6%97%B7%E9%87%8E"}, {"id": "card_057", "text": "人生苦短，糊弄一下也没什么不可以。", "meta": "real_other · 豆瓣「糊弄学」小組簡介（組長摩卡） · 👍0 · 語錄", "tags": ["語錄"], "url": "https://www.douban.com/group/694529/"}, {"id": "card_058", "text": "卷又卷不动，躺又躺不平", "meta": "real_other · 佚名（網路流行語，媒體定型為「45度青年」） · 👍0 · 語錄", "tags": ["語錄"], "url": "https://m.thepaper.cn/newsDetail_forw 魚", "職場"], "url": "https://www.tiktok.com/@s0972480ndu/video/7629737113348476167"}, {"id": "card_123", "text": "打工是不可能打工的，這輩子不可能打工", "meta": "real_other · 周立齊（「竊·格瓦拉」，2012 年警方採訪原話） · 👍0 · 語錄", "tags": ["語錄"], "url": "https://www.sohu.com/a/504062993_121124616"}, {"id": "card_124", "text": "上班的心情比上墳還沉重", "meta": "real_other · 佚名（網路流傳段子，無單一作者） · 👍0 · 職場", "tags": ["職場"], "url": "https://www.gushiciku.cn/dc_tw/106241076"}, {"id": "card_125", "text": "畢業後\n躺平七年沒餓死\n發現人生完全沒事", "meta": "real_other · viregeek · 👍0 · 耍廢", "tags": ["耍廢"], "url": "https://www.threads.com/@viregeek/post/DVC2mmQkTBd"}, {"id": "card_126", "text": "越躺平越順流。", "meta": "real_other · muffin_mcy · 👍0 · 耍廢", "tags": ["耍廢"], "url": "https://www.threads.com/@muffin_mcy/post/DSmC6MSkahN"}, {"id": "card_127", "text": "五點下班的時候，我去廁所洗個手，\n走出來的時候，整間公司只剩下我一個人了。\n哇！難道這就是五點下班的景色嗎？\n是，我賺的錢變少了，可是我卻很快樂。", "meta": "real_other · roland_yoo109 · 👍0 · 職場", "tags": ["職場"], "url": "https://www.threads.com/@roland_yoo109/post/DAlJGzyTAna"}, {"id": "card_128", "text": "有人說我不上進、人生好無趣\n但這樣的日子，好像也不錯🙂", "meta": "real_other · designer.lin20290fire · 👍0 · 語錄", "tags": ["語錄"], "url": "https://www.threads.com/@designer.lin20290fire/post/DKbMP2hzruA"}, {"id": "card_129", "text": "朋友公司的員工最近提離職，時間點準到讓人讚嘆：\n年終已入帳、尾牙也吃完，過年長假全薪領好領滿，\n回辦公室交接的時間不到 8 天。\n基本上就是把公司的剩餘價值榨到最後一滴，然後轉身走人。", "meta": "real_other · cynthiachen71 · 👍0 · 職場", "tags": ["職場"], "url": "https://www.threads.com/@cynthiachen71/post/DUlGBl9kbdH"}, {"id": "card_130", "text": "一週連上五天班\n真的好長好久喔⋯⋯⋯", "meta": "real_other · su_is.mama · 👍0 · 語錄", "tags": ["語錄"], "url": "https://www.threads.com/@su_is.mama/post/DHW6-3dTUfw"}, {"id": "card_131", "text": "找到工作 → 開始上班 → 好累只想躺平\n這人生循環真的無解欸", "meta": "real_other · designer.lin20290fire · 👍0 · 耍廢/職場", "tags": ["耍廢", "職場"], "url": "https://www.threads.com/@designer.lin20290fire/post/DOvfeLrE2gq"}, {"id": "card_132", "text": "大家千萬不要因為上班而焦慮、著急\n甚至懷疑人生", "meta": "real_other · dengdeng_stars · 👍0 · 職場", "tags": ["職場"], "url": "https://www.threads.com/@dengdeng_stars/post/DVKdBobkcj-"}, {"id": "card_133", "text": "上班摸魚在交友軟體上已讀亂回", "meta": "real_other · lucy_101314 · 👍255423 · 摸魚/職場", "tags": ["摸魚", "職場"], "url": "https://www.threads.net/@lucy_101314/post/DWGs-JWE3WE"}, {"id": "card_134", "text": "上班最爽的其實不是偷懶摸魚，而是手上有事做但全照自己的步調，沒人催；最累的是裝忙", "meta": "real_other · 1astsalt · 👍19100 · 摸魚/耍廢/職場", "tags": ["摸魚", "耍廢", "職場"], "url": "https://www.threads.net/@1astsalt/post/DQeal3akd4e"}, {"id": "card_135", "text": "上班時間最爽的時候（偷懶大王上身", "meta": "real_other · yi.yi.0111 · 👍19654 · 耍廢/職場", "tags": ["耍廢", "職場"], "url": "https://www.threads.net/@yi.yi.0111/post/DSjsROQgZkp"}, {"id": "card_136", "text": "這個上班摸魚群真的非常嚴格", "meta": "real_other · heyjiali___ · 👍19003 · 摸魚/職場", "tags": ["摸魚", "職場"], "url": "https://www.threads.net/@heyjiali___/post/DOdy5rKE8Fr"}, {"id": "card_137", "text": "回阿嬤家每年都會出現的角色：裝忙的小姨", "meta": "real_other · hs.jse · 👍51872 · 語錄", "tags": ["語錄"], "url": "https://www.threads.net/@hs.jse/post/DU5WHGqgUYE"}, {"id": "card_138", "text": "（狗尷尬時也會裝忙）", "meta": "real_other · averuioq · 👍14375 · 語錄", "tags": ["語錄"], "url": "https://www.threads.net/@averuioq/post/DTcKHnLEpT1"}, {"id": "card_139", "text": "其實我在偷看買票的你（站貓喵喵）", "meta": "real_other · catcat__train · 👍8083 · 語錄", "tags": ["語錄"], "url": "https://www.threads.net/@catcat__train/post/DOyBQvSk0p5"}, {"id": "card_140", "text": "每天上班摸魚直到我離職 day48——紅衫魚（稀有度/認知度/重要度/美味度星級）", "meta": "real_other · sakasyu_asia · 👍2177 · 摸魚/職場", "tags": ["摸魚", "職場"], "url": "https://www.threads.net/@sakasyu_asia/post/DUH3HzRkmJZ"}, {"id": "card_141", "text": "上班偷懶的不抓、上廁所一小時的不抓，抓我一個早餐吃大飯糰的", "meta": "real_other · shopee_tw · 👍10662 · 耍廢/職場", "tags": ["耍廢", "職場"], "url": "https://www.threads.net/@shopee_tw/post/DW0HxJRGBc_"}, {"id": "card_142", "text": "《這樣開會，最聰明》＝薪水小偷開會最佳指南", "meta": "real_other · anderson.c95 · 👍12748 · 職場", "tags": ["職場"], "url": "https://www.threads.net/@anderson.c95/post/DLqobAoShf2"}, {"id": "card_143", "text": "上班有四等：等午休 等下班 等發薪水 等放假", "meta": "real_other ·  "meta": "responses.fish.near_miss[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.near_miss[1]", "text": "那一下不像小魚", "meta": "responses.fish.near_miss[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.near_miss[2]", "text": "差一點，真的差一點", "meta": "responses.fish.near_miss[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.rare[0]", "text": "浮標沉得有點慢。水面不像剛才那麼安靜。", "meta": "responses.fish.teaser.rare[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.rare[1]", "text": "線被往旁邊拖了一下。這手感不太像小魚。", "meta": "responses.fish.teaser.rare[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.rare[2]", "text": "水底閃了一下。你突然坐直了。", "meta": "responses.fish.teaser.rare[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.epic[0]", "text": "魚線突然往下一沉，旁邊的人也看過來了", "meta": "responses.fish.teaser.epic[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.epic[1]", "text": "水面冒出一圈很大的波。這竿有點不禮貌。", "meta": "responses.fish.teaser.epic[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.epic[2]", "text": "線繃得很緊。你開始後悔剛剛坐太鬆。", "meta": "responses.fish.teaser.epic[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.legendary[0]", "text": "整片水面安靜了一秒。這通常不是好事。", "meta": "responses.fish.teaser.legendary[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.legendary[1]", "text": "浮標不見了，水面安靜得有點怪", "meta": "responses.fish.teaser.legendary[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.legendary[2]", "text": "你還沒拉竿，頻道先安靜了", "meta": "responses.fish.teaser.legendary[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.dream[0]", "text": "水面像被按了暫停，手上那支竿突然很有存在感", "meta": "responses.fish.teaser.dream[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.dream[1]", "text": "水底滑過一道影子，你覺得自己不該看到這個", "meta": "responses.fish.teaser.dream[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.dream[2]", "text": "這不是咬鉤。這比較像水底有人回你訊息。", "meta": "responses.fish.teaser.dream[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.event[0]", "text": "剛打下去的窩開始有反應。水面正在變忙。", "meta": "responses.fish.teaser.event[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.event[1]", "text": "魚群進窩了。浮標旁邊多了幾圈不該有的波。", "meta": "responses.fish.teaser.event[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.event[2]", "text": "這片水現在不太單純。", "meta": "responses.fish.teaser.event[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.failure.cat_steal[0]", "text": "岸邊有一道橘色的影子蹲好了。", "meta": "responses.fish.teaser.failure.cat_steal[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.failure.cat_steal[1]", "text": "你還在等魚，橘貓已經在等你。", "meta": "responses.fish.teaser.failure.cat_steal[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.failure.cat_steal[2]", "text": "旁邊傳來很輕的腳步聲。通常不是好消息。", "meta": "responses.fish.teaser.failure.cat_steal[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.failure.kid_disturb[0]", "text": "遠處有小孩開始集氣。", "meta": "responses.fish.teaser.failure.kid_disturb[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.failure.kid_disturb[1]", "text": "你聽到石頭落水前的那種笑聲。", "meta": "responses.fish.teaser.failure.kid_disturb[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.failure.kid_disturb[2]", "text": "旁邊突然熱鬧起來。魚可能不喜歡熱鬧。", "meta": "responses.fish.teaser.failure.kid_disturb[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.failure.junk[0]", "text": "手感很奇怪。像魚，又不像魚，主要是不太有尊嚴。", "meta": "responses.fish.teaser.failure.junk[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.failure.junk[1]", "text": "線是有重量的。希望不是你想的那種重量。", "meta": "responses.fish.teaser.failure.junk[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.teaser.failure.junk[2]", "text": "浮標沉了，但水面沒有魚該有的那種緊張感。", "meta": "responses.fish.teaser.failure.junk[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.no_charges[0]", "text": "沒竿了。水面還在，但你先沒了。", "meta": "responses.fish.no_charges[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.no_charges[1]", "text": "摸魚額度見底。再摸下去就太認真了。", "meta": "responses.fish.no_charges[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.no_charges[2]", "text": "沒竿了。水面先還給水面。", "meta": "responses.fish.no_charges[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.no_charges[3]", "text": "竿數見底。圖鑑 {collected}/{total}，可以假裝不在意。", "meta": "responses.fish.no_charges[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.no_charges[4]", "text": "沒竿了。你還想釣，系統也知道。", "meta": "responses.fish.no_charges[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.no_charges[5]", "text": "來都來了，但竿沒了。很有摸魚人生。", "meta": "responses.fish.no_charges[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.inventory_full[0]", "text": "魚塘已經塞滿，先賣掉一些或整理一下再繼續。", "meta": "responses.fish.inventory_full[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.inventory_full[1]", "text": "再釣下去魚塘要炸了，先清一輪比較穩。", "meta": "responses.fish.inventory_full[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.inventory_full[2]", "text": "魚塘客滿。牠們擠得跟週五的捷運一樣。先清再釣。", "meta": "responses.fish.inventory_full[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.inventory_full[3]", "text": "進不去了。魚都在裡面擠了。", "meta": "responses.fish.inventory_full[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.invalid_location[0]", "text": "找不到 `{location}` 這個地點，先用 `/地圖` 看看目前有哪些地方。", "meta": "responses.fish.invalid_location[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.invalid_location[1]", "text": "`{location}`？沒聽過。用 `/地圖` 確認一下。", "meta": "responses.fish.invalid_location[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.invalid_location[2]", "text": "這地名在地圖上找不到。`/地圖` 看看有哪些選擇。", "meta": "responses.fish.invalid_location[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.common[0]", "text": "{fish_name}，可以，好歹不是空軍", "meta": "responses.fish.success.common[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.common[1]", "text": "今天是 {fish_name} 局", "meta": "responses.fish.success.common[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.common[2]", "text": "{fish_name}，這樣不算虧吧？", "meta": "responses.fish.success.common[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.common[3]", "text": "{fish_name}，看起來不是很想上岸", "meta": "responses.fish.success.common[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.common[4]", "text": "{fish_name} 收了，下一竿", "meta": "responses.fish.success.common[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.uncommon[0]", "text": "{fish_name}，有料欸", "meta": "responses.fish.success.uncommon[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.uncommon[1]", "text": "{fish_name}，這竿手感不錯！", "meta": "responses.fish.success.uncommon[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.uncommon[2]", "text": "{fish_name}，水花比剛剛認真一點", "meta": "responses.fish.success.uncommon[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.uncommon[3]", "text": "{fish_name}，可以拿去群裡講一句", "meta": "responses.fish.success.uncommon[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.uncommon[4]", "text": "{fish_name}，浮標那一下有演到", "meta": "responses.fish.success.uncommon[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.rare[0]", "text": "{fish_name}，這條有點東西欸", "meta": "responses.fish.success.rare[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.rare[1]", "text": "{fish_name}，嘖嘖。", "meta": "responses.fish.success.rare[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.rare[2]", "text": "等等，{fish_name}？在 {location_name}？", "meta": "responses.fish.success.rare[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.rare[3]", "text": "{fish_name}，今天不太一樣", "meta": "responses.fish.success.rare[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.rare[4]", "text": "哦？{fish_name}，先看一下", "meta": "responses.fish.success.rare[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.rare[5]", "text": "真假，{fish_name} 在 {location_name}？", "meta": "responses.fish.success.rare[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.rare[6]", "text": "{fish_name}，線繃緊那一下就不一樣", "meta": "responses.fish.success.rare[6]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.epic[0]", "text": "在 {location_name} 摸到 {fish_name}，有點不合理欸", "meta": "responses.fish.success.epic[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.epic[1]", "text": "{fish_name}，這竿不太對勁", "meta": "responses.fish.success.epic[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.epic[2]", "text": "{fish_name}，旁邊的人都在看了", "meta": "responses.fish.success.epic[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.epic[3]", "text": "{fish_name}，手在抖", "meta": "responses.fish.success.epic[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.epic[4]", "text": "{fish_name}，線繃成這樣還是第一次", "meta": "responses.fish.success.epic[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.legendary[0]", "text": "{fish_name}。先截圖再說別的。", "meta": "responses.fish.success.legendary[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.legendary[1]", "text": "{location_name} 出了一條 {fish_name}，頻道需要知道這件事", "meta": "responses.fish.success.legendary[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.legendary[2]", "text": "竟然在 {location_name} 摸到 {fish_name}。", "meta": "responses.fish.success.legendary[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.legendary[3]", "text": "{fish_name}。跟朋友說他們不會信。", "meta": "responses.fish.success.legendary[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.legendary[4]", "text": "{fish_name}。有沒有搞錯。", "meta": "responses.fish.success.legendary[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.legendary[5]", "text": "{fish_name}。有夠扯。", "meta": "responses.fish.success.legendary[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.dream[0]", "text": "{fish_name}。這張可以先截圖。", "meta": "responses.fish.success.dream[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.dream[1]", "text": "不是吧。{fish_name}。", "meta": "responses.fish.success.dream[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.dream[2]", "text": "{fish_name}。這也太扯了吧。", "meta": "responses.fish.success.dream[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.dream[3]", "text": "{fish_name}，這竿可以講很久", "meta": "responses.fish.success.dream[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.dream[4]", "text": "{fish_name}，說了你也不信", "meta": "responses.fish.success.dream[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.dream[5]", "text": "{fish_name}。要確欸。", "meta": "responses.fish.success.dream[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.success.dream[6]", "text": "{fish_name}。你需要更大的船。", "meta": "responses.fish.success.dream[6]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.cat_steal[0]", "text": "{fish_name} 上鉤了，但橘董比你快", "meta": "responses.fish.failure.cat_steal[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.cat_steal[1]", "text": "線拉到一半，橘貓已經就定位了", "meta": "responses.fish.failure.cat_steal[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.cat_steal[2]", "text": "{fish_name} 離水面剩三公分，被叼走了", "meta": "responses.fish.failure.cat_steal[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.cat_steal[3]", "text": "你釣到的，但橘貓不這麼認為", "meta": "responses.fish.failure.cat_steal[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.cat_steal[4]", "text": "牠又來了，你看牠，牠看魚", "meta": "responses.fish.failure.cat_steal[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.cat_steal[5]", "text": "橘董今天心情不錯，只拿了一條，算牠客氣", "meta": "responses.fish.failure.cat_steal[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.kid_disturb[0]", "text": "噗通！石頭掉進釣點，魚散了", "meta": "responses.fish.failure.kid_disturb[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.kid_disturb[1]", "text": "水面突然炸開，不是魚，是石頭", "meta": "responses.fish.failure.kid_disturb[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.kid_disturb[2]", "text": "「哥哥你在幹嘛？」你還沒回答，魚已經跑了", "meta": "responses.fish.failure.kid_disturb[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.kid_disturb[3]", "text": "小孩把你的餌拿走了，跑得比魚還快", "meta": "responses.fish.failure.kid_disturb[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.kid_disturb[4]", "text": "三個小孩圍過來了，魚走了，安靜也走了", "meta": "responses.fish.failure.kid_disturb[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.kid_disturb[5]", "text": "遠處傳來尖叫，不是大事，但魚信了", "meta": "responses.fish.failure.kid_disturb[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.fish_escaped[0]", "text": "線有動，魚呢？", "meta": "responses.fish.failure.fish_escaped[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.fish_escaped[1]", "text": "剛才有感，但沒拉住！", "meta": "responses.fish.failure.fish_escaped[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.fish_escaped[2]", "text": "跑了？浮標還在晃欸", "meta": "responses.fish.failure.fish_escaped[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.fish_escaped[3]", "text": "牠碰了一下就走，敷衍得很完整", "meta": "responses.fish.failure.fish_escaped[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.fish_escaped[4]", "text": "手感是有的，魚沒有留下", "meta": "responses.fish.failure.fish_escaped[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[0]", "text": "拉上來一個塑膠袋。裡面什麼都沒有。", "meta": "responses.fish.failure.junk[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[1]", "text": "釣到一雙拖鞋，不知道是誰的故事", "meta": "responses.fish.failure.junk[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[2]", "text": "撈到一張泡水的發票，上面的字已經看不清了", "meta": "responses.fish.failure.junk[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[3]", "text": "拉上來一隻襪子。單隻的。", "meta": "responses.fish.failure.junk[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[4]", "text": "釣到一把生鏽的鑰匙，不知道開什麼的", "meta": "responses.fish.failure.junk[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[5]", "text": "銘謝惠顧。", "meta": "responses.fish.failure.junk[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[6]", "text": "拉上來一個寶特瓶。它看起來比你有精神。", "meta": "responses.fish.failure.junk[6]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[7]", "text": "所以我說那個魚呢？", "meta": "responses.fish.failure.junk[7]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[8]", "text": "釣到一片落葉。恭喜，你是葉魚玩家。", "meta": "responses.fish.failure.junk[8]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[9]", "text": "拉上來一條繩子，繩子的另一端什麼都沒有", "meta": "responses.fish.failure.junk[9]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[10]", "text": "釣到一個空罐頭。裡面有水。", "meta": "responses.fish.failure.junk[10]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[11]", "text": "撈到一隻橡膠小鴨。牠看起來比你快樂。", "meta": "responses.fish.failure.junk[11]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[12]", "text": "拉上來一個口罩。已經用過的那種。", "meta": "responses.fish.failure.junk[12]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[13]", "text": "釣到半截吸管。另外半截不知道在哪。", "meta": "responses.fish.failure.junk[13]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure.junk[14]", "text": "撈到一張名片。上面寫「財務自由教練」。你把它丟回去了。", "meta": "responses.fish.failure.junk[14]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.failure_tag.cat_steal[0]", "text": "本次記錄﹥橘董收走一份，無法申訴", "meta": "responses.fish.failure_tag.cat_steal[0]", "tags": ["fish"], "url ream[5]", "text": "🌟 **{player_name}** 在 {location_name} 摸到 **{fish_name}**，這很難假裝沒看到", "meta": "responses.fish.broadcast.dream[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.needed[0]", "text": "**{player_name}** 釣到一條 **{fish_name}**，但拉不動！快來幫忙，限時 3 分鐘！", "meta": "responses.fish.help.needed[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.needed[1]", "text": "**{player_name}** 鉤到 **{fish_name}** 了，一個人拉不上來。誰來搭把手？", "meta": "responses.fish.help.needed[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.needed[2]", "text": "大魚上鉤！**{player_name}** 需要人幫忙拉 **{fish_name}**。", "meta": "responses.fish.help.needed[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.needed[3]", "text": "**{player_name}** 的竿快斷了。**{fish_name}** 在水裡不肯上來。有人嗎？", "meta": "responses.fish.help.needed[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.needed[4]", "text": "**{player_name}** 跟 **{fish_name}** 僵持中。這場面需要第二個人。", "meta": "responses.fish.help.needed[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.needed[5]", "text": "**{player_name}** 跟 **{fish_name}** 拔河中，一個人不夠。三分鐘內需要支援！", "meta": "responses.fish.help.needed[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.needed[6]", "text": "**{player_name}** 鉤到 **{fish_name}**，竿快斷了。來不來？", "meta": "responses.fish.help.needed[6]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.needed[7]", "text": "**{player_name}** 在水邊跟 **{fish_name}** 對峙。幫拉一下，不然要跑了。", "meta": "responses.fish.help.needed[7]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.success[0]", "text": "**{helper_name}** 幫 **{requester_name}** 把 **{fish_name}** 拉上來了！", "meta": "responses.fish.help.success[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.success[1]", "text": "合力拉上了 **{fish_name}**！**{requester_name}** 和 **{helper_name}** 都有好處拿。", "meta": "responses.fish.help.success[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.success[2]", "text": "**{fish_name}** 到手！感謝 **{helper_name}** 的神助攻。", "meta": "responses.fish.help.success[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.success[3]", "text": "兩個人硬是把 **{fish_name}** 拖上岸了。好東西要和好朋友分享。", "meta": "responses.fish.help.success[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.success[4]", "text": "**{helper_name}** 一出手就知道有沒有。**{fish_name}** 上岸了。", "meta": "responses.fish.help.success[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.success[5]", "text": "**{requester_name}** 和 **{helper_name}** 的革命友誼 +1。**{fish_name}** 到手。", "meta": "responses.fish.help.success[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.success[6]", "text": "搞定了。**{helper_name}** 來得剛好，**{fish_name}** 跑不掉了。", "meta": "responses.fish.help.success[6]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.expired[0]", "text": "來晚了，人家已經自己拉上來了。", "meta": "responses.fish.help.expired[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.expired[1]", "text": "慢了一步，魚已經上岸了。", "meta": "responses.fish.help.expired[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.expired[2]", "text": "這波沒跟到，人家已經拉上來了。", "meta": "responses.fish.help.expired[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.expired[3]", "text": "不用了，人家自己搞定了。", "meta": "responses.fish.help.expired[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.expired[4]", "text": "慢了一步。魚已經上岸了。", "meta": "responses.fish.help.expired[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.timeout_given[0]", "text": "⏰ 三分鐘過去，**{requester_name}** 自己把 **{fish_name}** 拉上來。群組錯過了一個可以起鬨的畫面。", "meta": "responses.fish.help.timeout_given[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.timeout_given[1]", "text": "⏰ 沒人來。**{requester_name}** 默默把 **{fish_name}** 拖上岸，手很痠。", "meta": "responses.fish.help.timeout_given[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.timeout_given[2]", "text": "⏰ **{requester_name}** 看了一眼群組，沒人回。那就自己來。**{fish_name}** 上岸。", "meta": "responses.fish.help.timeout_given[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.timeout_given[3]", "text": "⏰ 三分鐘很短，沒人來的時候很長。**{fish_name}** 還是上岸了。", "meta": "responses.fish.help.timeout_given[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.timeout_given[4]", "text": "⏰ 沒有支援，只有 **{requester_name}** 和一條很重的 **{fish_name}**。", "meta": "responses.fish.help.timeout_given[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.timeout_given[5]", "text": "⏰ **{requester_name}** 自己拉完了。沒人見證，但魚塘會記得。", "meta": "responses.fish.help.timeout_given[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.timeout_given[6]", "text": "⏰ 幫手沒到，**{requester_name}** 到了極限。還好 **{fish_name}** 也到了岸邊。", "meta": "responses.fish.help.timeout_given[6]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.help.timeout_given[7]", "text": "⏰ 這場共演缺席了一個人。**{requester_name}** 還是把 **{fish_name}** 拉上來了。", "meta": "responses.fish.help.timeout_given[7]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.welcome_back[0]", "text": "好久不見。水裡的魚沒在等你，但牠們還在。", "meta": "responses.fish.welcome_back[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.welcome_back[1]", "text": "回來了？魚塘沒什麼變。", "meta": "responses.fish.welcome_back[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.welcome_back[2]", "text": "離開了一陣子，手感要重新抓一下。", "meta": "responses.fish.welcome_back[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.welcome_back[3]", "text": "又回來摸魚了。沒事，這裡不打卡。", "meta": "responses.fish.welcome_back[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.welcome_back[4]", "text": "回來了喔。", "meta": "responses.fish.welcome_back[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.welcome_back[5]", "text": "你離開的這段時間，魚也沒閒著。", "meta": "responses.fish.welcome_back[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.welcome_back[6]", "text": "久違了。竿子還沒生鏽。", "meta": "responses.fish.welcome_back[6]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.welcome_back[7]", "text": "你不在的時候有人釣了大的。不是你就是了。", "meta": "responses.fish.welcome_back[7]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.welcome_back[8]", "text": "水面看起來跟你離開的時候一樣。但魚換了一批。", "meta": "responses.fish.welcome_back[8]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.welcome_back[9]", "text": "想你了。不是我說的，是魚塘。", "meta": "responses.fish.welcome_back[9]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.new_collection[0]", "text": "圖鑑多了一格。有些東西集到了就是不一樣。", "meta": "responses.fish.new_collection[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.new_collection[1]", "text": "新的一頁亮了。繼續摸，還有更多。", "meta": "responses.fish.new_collection[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.new_collection[2]", "text": "這條之前沒見過。從現在起，牠是你的了。", "meta": "responses.fish.new_collection[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.new_collection[3]", "text": "圖鑑 +1。每一格都是摸出來的。", "meta": "responses.fish.new_collection[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.new_collection[4]", "text": "又認識了一種。", "meta": "responses.fish.new_collection[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.new_collection[5]", "text": "就決定是你了。歡迎入住圖鑑。", "meta": "responses.fish.new_collection[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.new_collection[6]", "text": "圖鑑的燈又亮了一格。這種感覺比釣到牠還好。", "meta": "responses.fish.new_collection[6]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.new_collection[7]", "text": "收錄完成。牠在你的圖鑑裡有自己的位子了。", "meta": "responses.fish.new_collection[7]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.new_collection[8]", "text": "新的一條。圖鑑翻到這一頁的時候，會記得今天。", "meta": "responses.fish.new_collection[8]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.new_collection[9]", "text": "你跟牠是第一次見面。牠不知道，但你會記得。", "meta": "responses.fish.new_collection[9]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.park_pond.common[0]", "text": "公園池塘的 {fish_name}。安全牌中的安全牌。", "meta": "responses.fish.location_success.park_pond.common[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.park_pond.common[1]", "text": "{fish_name}。在禁止釣魚的地方釣到的。", "meta": "responses.fish.location_success.park_pond.common[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.park_pond.common[2]", "text": "{fish_name}。阿伯看了一眼，繼續下棋。", "meta": "responses.fish.location_success.park_pond.common[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.park_pond.rare[0]", "text": "在公園池塘摸到 {fish_name}？這裡水不深啊。", "meta": "responses.fish.location_success.park_pond.rare[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.park_pond.rare[1]", "text": "{fish_name}。池塘裡竟然有這種。", "meta": "responses.fish.location_success.park_pond.rare[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.harbor_breakwater.common[0]", "text": "消波塊上的 {fish_name}。風很大，但值得。", "meta": "responses.fish.location_success.harbor_breakwater.common[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.harbor_breakwater.common[1]", "text": "{fish_name}。海風把鹽吹到嘴裡了。", "meta": "responses.fish.location_success.harbor_breakwater.common[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.harbor_breakwater.rare[0]", "text": "消波塊旁邊的 {fish_name}。海在給你面子。", "meta": "responses.fish.location_success.harbor_breakwater.rare[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.harbor_breakwater.rare[1]", "text": "{fish_name}。海面底下確實有東西。", "meta": "responses.fish.location_success.harbor_breakwater.rare[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.suburban_pond.common[0]", "text": "魚塘裡的 {fish_name}。午後三點。蟬在叫。", "meta": "responses.fish.location_success.suburban_pond.common[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.suburban_pond.common[1]", "text": "{fish_name}。你快睡著了但牠上來了。", "meta": "responses.fish.location_success.suburban_pond.common[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.suburban_pond.rare[0]", "text": "郊區魚塘出了 {fish_name}。這片水比看起來深。", "meta": "responses.fish.location_success.suburban_pond.rare[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.suburban_pond.rare[1]", "text": "{fish_name}。蟬突然不叫了。", "meta": "responses.fish.location_success.suburban_pond.rare[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.night_market_drain.common[0]", "text": "水溝裡的 {fish_name}。意外地新鮮。", "meta": "responses.fish.location_success.night_market_drain.common[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.night_market_drain.common[1]", "text": "{fish_name}。水溝出品，品質不保證。", "meta": "responses.fish.location_success.night_market_drain.common[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.night_market_drain.rare[0]", "text": "夜市水溝出了 {fish_name}？三十公分的水溝？", "meta": "responses.fish.location_success.night_market_drain.rare[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.night_market_drain.rare[1]", "text": "{fish_name}。你看了看水溝，再看了看牠。", "meta": "responses.fish.location_success.night_market_drain.rare[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.river_levee.common[0]", "text": "河堤的 {fish_name}。伯伯點了點頭。", "meta": "responses.fish.location_success.river_levee.common[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.river_levee.common[1]", "text": "{fish_name}。河風吹得很舒服。", "meta": "responses.fish.location_success.river_levee.common[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.river_levee.rare[0]", "text": "河堤出了 {fish_name}。伯伯站起來看了一眼。", "meta": "responses.fish.location_success.river_levee.rare[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.location_success.river_levee.rare[1]", "text": "{fish_name}。河面起了漣漪。", "meta": "responses.fish.location_success.river_levee.rare[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.park_pond[0]", "text": "公園池塘的水面很平。鴿子在散步。", "meta": "responses.fish.map_flavor.park_pond[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.park_pond[1]", "text": "旁邊那個阿伯比你早到兩小時了。", "meta": "responses.fish.map_flavor.park_pond[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.park_pond[2]", "text": "「禁止釣魚」的牌子歪了。沒人扶。", "meta": "responses.fish.map_flavor.park_pond[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.park_pond[3]", "text": "有隻松鼠在看你。牠可能覺得你很奇怪。", "meta": "responses.fish.map_flavor.park_pond[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.park_pond[4]", "text": "池塘邊的長椅上有人在睡覺。", "meta": "responses.fish.map_flavor.park_pond[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.harbor_breakwater[0]", "text": "風很大。頭髮一直飄。", "meta": "responses.fish.map_flavor.harbor_breakwater[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.harbor_breakwater[1]", "text": "遠處有貨櫃船在動。很慢。", "meta": "responses.fish.map_flavor.harbor_breakwater[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.harbor_breakwater[2]", "text": "消波塊上有鹽味。屁股有點涼。", "meta": "responses.fish.map_flavor.harbor_breakwater[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.harbor_breakwater[3]", "text": "海鳥叫了一聲。不知道在叫什麼。", "meta": "responses.fish.map_flavor.harbor_breakwater[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.harbor_breakwater[4]", "text": "浪聲很規律。很催眠。", "meta": "responses.fish.map_flavor.harbor_breakwater[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.suburban_pond[0]", "text": "蟬在叫。叫得你想睡。", "meta": "responses.fish.map_flavor.suburban_pond[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.suburban_pond[1]", "text": "水面有浮萍。綠綠的。", "meta": "responses.fish.map_flavor.suburban_pond[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.suburban_pond[2]", "text": "午後的光線很柔。時間好像慢了。", "meta": "responses.fish.map_flavor.suburban_pond[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.suburban_pond[3]", "text": "遠處有工廠的聲音。聽不太清楚。", "meta": "responses.fish.map_flavor.suburban_pond[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.suburban_pond[4]", "text": "魚塘邊停了一台貨車。不知道誰的。", "meta": "responses.fish.map_flavor.suburban_pond[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.night_market_drain[0]", "text": "臭豆腐味。確實很臭。但你習慣了。", "meta": "responses.fish.map_flavor.night_market_drain[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.night_market_drain[1]", "text": "有人在旁邊吵架。跟你無關。", "meta": "responses.fish.map_flavor.night_market_drain[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.night_market_drain[2]", "text": "水溝蓋有一片是掀開的。你假裝沒看到。", "meta": "responses.fish.map_flavor.night_market_drain[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.night_market_drain[3]", "text": "攤販老闆看了你一眼。什麼都沒說。", "meta": "responses.fish.map_flavor.night_market_drain[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.night_market_drain[4]", "text": "塑膠袋在水溝裡飄。很有節奏感。", "meta": "responses.fish.map_flavor.night_market_drain[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.river_levee[0]", "text": "河堤上有風。剛好。", "meta": "responses.fish.map_flavor.river_levee[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.river_levee[1]", "text": "伯伯在旁邊。他不說話。你也不說話。", "meta": "responses.fish.map_flavor.river_levee[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.river_levee[2]", "text": "自行車道上有人經過。沒有看你。", "meta": "responses.fish.map_flavor.river_levee[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.river_levee[3]", "text": "遠處橋上的車燈在動。很遠。", "meta": "responses.fish.map_flavor.river_levee[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.map_flavor.river_levee[4]", "text": "河面反光。有點刺眼但很好看。", "meta": "responses.fish.map_flavor.river_levee[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[0]", "text": "……你覺得水面有東西在看你。大概是錯覺。", "meta": "responses.fish.deep_night_hints[0]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[1]", "text": "橘董不在。牠通常這個時間不會離開的。", "meta": "responses.fish.deep_night_hints[1]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[2]", "text": "風停了。什麼聲音都沒有。", "meta": "responses.fish.deep_night_hints[2]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[3]", "text": "月亮照在水面上。水面下的東西比水面上的多。", "meta": "responses.fish.deep_night_hints[3]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[4]", "text": "你聽到了嗎。大概沒有。", "meta": "responses.fish.deep_night_hints[4]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[5]", "text": "水底有東西動了一下。不是魚的動法。", "meta": "responses.fish.deep_night_hints[5]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[6]", "text": "剛才的那條……不重要。", "meta": "responses.fish.deep_night_hints[6]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[7]", "text": "這個時間的水面比白天暗。不只是因為沒有太陽。", "meta": "responses.fish.deep_night_hints[7]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[8]", "text": "旁邊的路燈閃了一下。水面上的影子跟著閃了一下。但方向不對。", "meta": "responses.fish.deep_night_hints[8]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[9]", "text": "安靜。太安靜了。連蟲叫都停了。", "meta": "responses.fish.deep_night_hints[9]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[10]", "text": "橘董白天都在的。牠不在的時候，是水邊不適合待。", "meta": "responses.fish.deep_night_hints[10]", "tags": ["fish"], "url": ""}, {"id": "responses.fish.deep_night_hints[11]", "text": "你聽到水底的聲音了嗎。不是魚。魚不會發出那種聲音。", "meta": "responses.fish.deep_night_hints[11]", "tags": ["fish"], "url": ""}, {"id": "responses.pond.empty[0]", "text": "魚塘空的。先去 `/釣魚` 看看。", "meta": "responses.pond.empty[0]", "tags": ["pond"], "url": ""}, {"id": "responses.pond.empty[1]", "text": "空的。連隻蝦都沒有。", "meta": "responses.pond.empty[1]", "tags": ["pond"], "url": ""}, {"id": "responses.pond.empty[2]", "text": "什麼都沒有。安靜得能聽到自己的心跳。", "meta": "responses.pond.empty[2]", "tags": ["pond"], "url": ""}, {"id": "responses.pond.empty[3]", "text": "魚塘一片空白。像你的存款簿。", "meta": "responses.pond.empty[3]", "tags": ["pond"], "url": ""}, {"id": "responses.pond.header[0]", "text": "魚塘裡有 {count} 條魚。", "meta": "responses.pond.header[0]", "tags": ["pond"], "url": ""}, {"id": "responses.pond.line[0]", "text": "[{rarity}] {fish_name} / $ {value}", "meta": "responses.pond.line[0]", "tags": ["pond"], "url": ""}, {"id": "responses.sell.no_target[0]", "text": "要賣哪種？`/賣魚 全部`、`/賣魚 重複`，或填魚名。", "meta": "responses.sell.no_target[0]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.no_target[1]", "text": "賣什麼？全部、重複、還是指定魚名？", "meta": "responses.sell.no_target[1]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.no_target[2]", "text": "你站在魚塘前面發呆。要賣哪種說一聲。", "meta": "responses.sell.no_target[2]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.not_found[0]", "text": "魚塘裡找不到 `{target}`。", "meta": "responses.sell.not_found[0]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.not_found[1]", "text": "找不到 `{target}`。確定名字對嗎？", "meta": "responses.sell.not_found[1]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.not_found[2]", "text": "`{target}`？翻遍魚塘都沒看到。", "meta": "responses.sell.not_found[2]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.empty[0]", "text": "魚塘是空的，沒東西能賣。", "meta": "responses.sell.empty[0]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.empty[1]", "text": "魚塘連灰塵都沒有，賣什麼。", "meta": "responses.sell.empty[1]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.empty[2]", "text": "要賣東西得先有東西。去 `/釣魚` 吧。", "meta": "responses.sell.empty[2]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.no_duplicates[0]", "text": "沒有重複魚，不用整理。", "meta": "responses.sell.no_duplicates[0]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.no_duplicates[1]", "text": "每條都是獨生子，沒得賣。", "meta": "responses.sell.no_duplicates[1]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.no_duplicates[2]", "text": "一條重複的都沒有。收藏家精神。", "meta": "responses.sell.no_duplicates[2]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_all[0]", "text": "整池清空。{count} 條換了 $ {value}，魚塘乾淨了但有點空。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_all[0]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_all[1]", "text": "全賣了。{count} 條，$ {value} 入帳。空蕩蕩的魚塘等著被重新填滿。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_all[1]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_all[2]", "text": "一口氣出清 {count} 條，$ {value}。有種週五下班的爽感。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_all[2]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_all[3]", "text": "{count} 條魚，$ {value}。清空的瞬間有種奇妙的輕盈感。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_all[3]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_all[4]", "text": "做了就做了。{count} 條，$ {value}。魚塘從頭來過。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_all[4]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_duplicates[0]", "text": "重複的清一清，{count} 條換 $ {value}。留下來的都是獨一無二的。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_duplicates[0]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_duplicates[1]", "text": "重複魚走了 {count} 條，$ {value} 入帳。魚塘清爽多了。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_duplicates[1]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_duplicates[2]", "text": "重複的走了 {count} 條，$ {value}。留下來的都不一樣。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_duplicates[2]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_duplicates[3]", "text": "每種只留一條。{count} 條重複魚，$ {value}。斷捨離。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_duplicates[3]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_one_type[0]", "text": "`{fish_name}` 賣了 {count} 條，$ {value}。再見了。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_one_type[0]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_one_type[1]", "text": "{count} 條 `{fish_name}` 換了 $ {value}。希望牠們在別的魚塘過得好。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_one_type[1]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_one_type[2]", "text": "{count} 條 `{fish_name}`，$ {value}。不在乎天長地久。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_one_type[2]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_one_type[3]", "text": "送走 {count} 條 `{fish_name}`，$ {value}。牠走的時候回頭看了你一眼。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_one_type[3]", "tags": ["sell"], "url": ""}, {"id": "responses.sell.sold_one_type[4]", "text": "`{fish_name}` 走了。{count} 條，$ {value}。牠沒回頭。魚幣 $ {new_coin}。", "meta": "responses.sell.sold_one_type[4]", "tags": ["sell"], "url": ""}, {"id": "responses.intel.insufficient_coin[0]", "text": "阿伯看了看你的口袋。$ {cost} 才願意開口，你現在只有 $ {current}。", "meta": "responses.intel.insufficient_coin[0]", "tags": ["intel"], "url": ""}, {"id": "responses.intel.insufficient_coin[1]", "text": "這種小道消息不是免費的。再摸個 $ {cost} 左右比較有誠意。", "meta": "responses.intel.insufficient_coin[1]", "tags": ["intel"], "url": ""}, {"id": "responses.intel.insufficient_coin[2]", "text": "你口袋只有 $ {current}，阿伯把保溫杯蓋回去了。", "meta": "responses.intel.insufficient_coin[2]", "tags": ["intel"], "url": ""}, {"id": "responses.intel.success[0]", "text": "阿伯壓低聲音：「{map_name} 今天的水，不太像平常。」", "meta": "responses.intel.success[0]", "tags": ["intel"], "url": ""}, {"id": "responses.intel.success[1]", "text": "旁邊釣友看了你一眼：「{map_name} 那邊最近有人空手回來，也有人笑得很怪。」", "meta": "responses.intel.success[1]", "tags": ["intel"], "url": ""}, {"id": "responses.intel.success[2]", "text": "攤販老闆擦著手：「{map_name} 最近有動靜。你不要說是我講的。」", "meta": "responses.intel.success[2]", "tags": ["intel"], "url": ""}, {"id": "responses.intel.success[3]", "text": "阿伯沒有看你，只看著水：「{map_name} 可以試。但不要太相信我。」", "meta": "responses.intel.success[3]", "tags": ["intel"], "url": ""}, {"id": "responses.tidy.no_duplicates[0]", "text": "魚塘乾淨的，沒有重複魚。", "meta": "responses.tidy.no_duplicates[0]", "tags": ["tidy"], "url": ""}, {"id": "responses.tidy.no_duplicates[1]", "text": "一條重複的都沒有，不用整理。", "meta": "responses.tidy.no_duplicates[1]", "tags": ["tidy"], "url": ""}, {"id": "responses.tidy.no_duplicates[2]", "text": "魚塘狀態良好，每條都是獨一無二。", "meta": "responses.tidy.no_duplicates[2]", "tags": ["tidy"], "url": ""}, {"id": "responses.tidy.success[0]", "text": "整理完，賣 {count} 條重複魚，收 $ {value}。魚幣 $ {new_coin}。", "meta": "responses.tidy.success[0]", "tags": ["tidy"], "url": ""}, {"id": "responses.tidy.success[1]", "text": "{count} 條重複魚清掉了，$ {value} 入帳。清爽。魚幣 $ {new_coin}。", "meta": "responses.tidy.success[1]", "tags": ["tidy"], "url": ""}, {"id": "responses.tidy.success[2]", "text": "魚塘大掃除。{count} 條重複魚離場，$ {value} 到手。魚幣 $ {new_coin}。", "meta": "responses.tidy.success[2]", "tags": ["tidy"], "url": ""}, {"id": "responses.tidy.success[3]", "text": "{count} 條重複的走了，$ {value} 入帳。每種只留一條，看起來像個展覽。魚幣 $ {new_coin}。", "meta": "responses.tidy.success[3]", "tags": ["tidy"], "url": ""}, {"id": "responses.spot.insufficient_coin[0]", "text": "想添這把餌要 $ {cost}。你現在只有 $ {current}，水面暫時不想理你。", "meta": "responses.spot.insufficient_coin[0]", "tags": ["spot"], "url": ""}, {"id": "responses.spot.insufficient_coin[1]", "text": "$ {cost} 才能丟這一手。你口袋只有 $ {current}，差一口氣。", "meta": "responses.spot.insufficient_coin[1]", "tags": ["spot"], "url": ""}, {"id": "responses.spot.insufficient_coin[2]", "text": "你現在的魚幣不太像能打出這一把餌。$ {cost} 才夠。", "meta": "responses.spot.insufficient_coin[2]", "tags": ["spot"], "url": ""}, {"id": "responses.spot.already_active[0]", "text": "{player_name} 剛剛已經打過窩了，`{event_name}` 大概還有 {remaining_minutes} 分鐘。", "meta": "responses.spot.already_active[0]", "tags": ["spot"], "url": ""}, {"id": "responses.spot.already_active[1]", "text": "水面已經被 {player_name} 弄熱了。`{event_name}` 還有 {remaining_minutes} 分鐘左右，先摸起來。", "meta": "responses.spot.already_active[1]", "tags": ["spot"], "url": ""}, {"id": "responses.spot.already_active[2]", "text": "{player_name} 打的窩還熱著。`{event_name}` 還有 {remaining_minutes} 分鐘左右。", "meta": "responses.spot.already_active[2]", "tags": ["spot"], "url": ""}, {"id": "responses.spot.success[0]", "text": "{player_name} 補上最後一把餌。大家湊到 $ {cost}，接下來約 {remaining_minutes} 分鐘，`{map_name}` 會比較可疑。", "meta": "responses.spot.success[0]", "tags": ["spot"], "url": ""}, {"id": "responses.spot.success[1]", "text": "{player_name} 讓這一窩成形了。$ {cost} 湊齊，本頻道進入「魚群進窩」狀態。", "meta": "responses.spot.success[1]", "tags": ["spot"], "url": ""}, {"id": "responses.spot.success[2]", "text": "打窩成功。`{map_name}` 約 {remaining_minutes} 分鐘內不太平靜，出錢的人都有名字。", "meta": "responses.spot.success[2]", "tags": ["spot"], "url": ""}, {"id": "responses.spot.success[3]", "text": "好料要大家一起丟。{player_name} 補上最後一手，接下來約 {remaining_minutes} 分鐘大家一起試手氣。", "meta": "responses.spot.success[3]", "tags": ["spot"], "url": ""}, {"id": "responses.collection.empty[0]", "text": "圖鑑還沒亮。先去釣幾條。", "meta": "responses.collection.empty[0]", "tags": ["collection"], "url": ""}, {"id": "responses.collection.empty[1]", "text": "空的。萬事起頭難，先去 `/釣魚`。", "meta": "responses.collection.empty[1]", "tags": ["collection"], "url": ""}, {"id": "responses.collection.empty[2]", "text": "一片空白。每個收藏家都是從第一條開始的。", "meta": "responses.collection.empty[2]", "tags": ["collection"], "url": ""}, {"id": "responses.collection.summary[0]", "text": "已收集 {collected} / {total}。", "meta": "responses.collection.summary[0]", "tags": ["collection"], "url": ""}, {"id": "responses.collection.badges_empty[0]", "text": "徽章櫃空的，先把圖鑑點亮幾格。", "meta": "responses.collection.badges_empty[0]", "tags": ["collection"], "url": ""}, {"id": "responses.collection.badges_empty[1]", "text": "徽章要靠圖鑑解鎖。先去釣。", "meta": "responses.collection.badges_empty[1]", "tags": ["collection"], "url": ""}, {"id": "responses.collection.badges_empty[2]", "text": "徽章還沒有。多認識幾種魚，自然就來了。", "meta": "responses.collection.badges_empty[2]", "tags": ["collection"], "url": ""}, {"id": "responses.event.fish_swarm.near_threshold[0]", "text": "魚影越來越密，再幾竿就要熱鬧起來了。", "meta": "responses.event.fish_swarm.near_threshold[0]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.near_threshold[1]", "text": "水底有動靜。快了。", "meta": "responses.event.fish_swarm.near_threshold[1]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.near_threshold[2]", "text": "水面開始不安分了。有東西要來。", "meta": "responses.event.fish_swarm.near_threshold[2]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.near_threshold[3]", "text": "浮標在抖。不是風，是魚。快了。", "meta": "responses.event.fish_swarm.near_threshold[3]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.start[0]", "text": "**{player_name}** 把魚群引來了！稀有魚比較肯出面。", "meta": "responses.event.fish_swarm.start[0]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.start[1]", "text": "**{player_name}** 把牠們招來的。魚群來襲。", "meta": "responses.event.fish_swarm.start[1]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.start[2]", "text": "**{player_name}** 的第 {threshold} 竿引爆了魚群。大家動起來。", "meta": "responses.event.fish_swarm.start[2]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.start[3]", "text": "大咬了。**{player_name}** 把牠們招來的。現在下竿會有好事。", "meta": "responses.event.fish_swarm.start[3]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.end[0]", "text": "魚群散了，水面安靜下來。", "meta": "responses.event.fish_swarm.end[0]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.end[1]", "text": "走了。剛才那波算你們賺到。", "meta": "responses.event.fish_swarm.end[1]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.end[2]", "text": "魚群走了。熱鬧的時候總是特別短。", "meta": "responses.event.fish_swarm.end[2]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.end[3]", "text": "散場了。水面恢復那種什麼都不會發生的樣子。", "meta": "responses.event.fish_swarm.end[3]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.special_catch[0]", "text": "這條明顯是趁魚群衝上來的。", "meta": "responses.event.fish_swarm.special_catch[0]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.special_catch[1]", "text": "魚群加成。平常這條不會出來見人。", "meta": "responses.event.fish_swarm.special_catch[1]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.special_catch[2]", "text": "混在魚群裡的好貨。眼尖的才看得到。", "meta": "responses.event.fish_swarm.special_catch[2]", "tags": ["event"], "url": ""}, {"id": "responses.event.fish_swarm.special_catch[3]", "text": "魚群散了以後就不會出現了。算你手快。", "meta": "responses.event.fish_swarm.special_catch[3]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.start[0]", "text": "**{player_name}** 這一竿把大魚吵出來了。接下來大家都有機會摸到更誇張的。", "meta": "responses.event.big_one_appears.start[0]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.start[1]", "text": "水底有大東西在動。**{player_name}** 引起的。各位，手感會不太一樣。", "meta": "responses.event.big_one_appears.start[1]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.start[2]", "text": "**{player_name}** 把深水區的傢伙驚動了。接下來釣到大的別太意外。", "meta": "responses.event.big_one_appears.start[2]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.start[3]", "text": "有大東西浮上來了。感謝 **{player_name}**。各位把竿抓穩。", "meta": "responses.event.big_one_appears.start[3]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.end[0]", "text": "大魚動靜退了，水面開始裝沒事。", "meta": "responses.event.big_one_appears.end[0]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.end[1]", "text": "大的走了。回到小搞搞。", "meta": "responses.event.big_one_appears.end[1]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.end[2]", "text": "水底安靜了。大傢伙回深水區了。", "meta": "responses.event.big_one_appears.end[2]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.end[3]", "text": "剛才那個重量感還在，水面先裝沒事。", "meta": "responses.event.big_one_appears.end[3]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.special_catch[0]", "text": "這條帶著大魚現身的氣息，平常不會這樣。", "meta": "responses.event.big_one_appears.special_catch[0]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.special_catch[1]", "text": "大魚時段限定。運氣是有的。", "meta": "responses.event.big_one_appears.special_catch[1]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.special_catch[2]", "text": "被大魚吸引出來的。平常牠不露面。", "meta": "responses.event.big_one_appears.special_catch[2]", "tags": ["event"], "url": ""}, {"id": "responses.event.big_one_appears.special_catch[3]", "text": "大魚時段的紅利。這條平常釣不到。", "meta": "responses.event.big_one_appears.special_catch[3]", "tags": ["event"], "url": ""}, {"id": "responses.admin.event_triggered[0]", "text": "管理員觸發了 `{event_type}`。", "meta": "responses.admin.event_triggered[0]", "tags": ["admin"], "url": ""}, {"id": "responses.admin.event_not_found[0]", "text": "沒有這個事件類型。可用：`fish_swarm`、`big_one_appears`。", "meta": "responses.admin.event_not_found[0]", "tags": ["admin"], "url": ""}]}, {"key": "commands", "name": "指令說明文案", "hint": "commands.yaml 418 條：指令名／描述／參數說明。", "items": [{"id": "version", "text": "0.3", "meta": "version", "tags": ["version"], "url": ""}, {"id": "project", "text": "摸魚人生", "meta": "project", "tags": ["project"], "url": ""}, {"id": "commands[0].id", "text": "fish", "meta": "commands[0].id", "tags": ["id"], "url": ""}, {"id": "commands[0].name", "text": "釣魚", "meta": "commands[0].name", "tags": ["name"], "url": ""}, {"id": "commands[0].aliases[0]", "text": "拋竿", "meta": "commands[0].aliases[0]", "tags": ["aliases[0]"], "url": ""}, {"id": "commands[0].aliases[1]", "text": "fish", "meta": "commands[0].aliases[1]", "tags": ["aliases[1]"], "url": ""}, {"id": "commands[0].category", "text": "core", "meta": "commands[0].category", "tags": ["category"], "url": ""}, {"id": "commands[0].description", "text": "在目前地圖釣魚，消耗一次 charge。", "meta": "commands[0].description", "tags": ["descrip 的事就是還沒做完，沒毛病", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0063", "text": "我不是慢，是節奏跟別人不一樣", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0064", "text": "躺著想事情，效率其實沒比較差", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0065", "text": "今天適合什麼都不適合", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0066", "text": "我的待辦清單也需要休息", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0067", "text": "閒著沒事，正是事情最少的證明", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0068", "text": "我把時間花在發呆，不算亂花", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0069", "text": "能拖到明天的，都不算今天的事", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0070", "text": "我這不是擺爛，是穩定維持現狀", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0071", "text": "坐著看雲飄過，也算有產出", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0072", "text": "不動如山，這四個字是誇我", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0073", "text": "我休息得很認真，沒在開玩笑", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0074", "text": "行程表空白，代表人生很從容", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0075", "text": "我不趕時間，因為時間也不趕我", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0076", "text": "發呆十分鐘，省下一整天的焦慮", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0077", "text": "今天的我，決定相信明天的我", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0078", "text": "什麼都還沒開始，所以什麼都還來得及", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0079", "text": "我躺著，是為了把姿勢調到最舒服", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0080", "text": "不是我慢吞吞，是世界太急了", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0081", "text": "我這叫保留體力，不叫沒體力", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0082", "text": "閒下來才看得清楚，自己有多閒", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0083", "text": "我把待機當成一種專業", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0084", "text": "沒事做的時候，最適合繼續沒事做", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0085", "text": "我不是放棄，是放過自己", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0086", "text": "今天先這樣，明天看心情", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0087", "text": "我發呆的時候，腦袋其實在度假", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0088", "text": "能坐就坐，能躺更好，能睡最棒", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0089", "text": "我不是在浪費時間，是時間陪我", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0090", "text": "急的事先放著，它自己會冷靜", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0091", "text": "我把節奏放慢，是怕快樂跟不上", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0092", "text": "今天的目標，是沒有目標", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0093", "text": "耍廢也是要花時間練的，我練很久了", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0094", "text": "我這不是懶，是把精力分配得很省", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0095", "text": "什麼都不想，是最划算的休息", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0096", "text": "我坐在這裡，就已經完成今天的份", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0097", "text": "事情堆著沒關係，它們不會跑", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0098", "text": "我不是停下來，是停在剛好的地方", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0099", "text": "放鬆是天賦，我剛好很有天賦", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0100", "text": "我把今天過得很慢，是怕它太快結束", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0101", "text": "沒進度也是一種進度，叫零進度", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0102", "text": "我休息不需要理由，但理由我有一堆", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0103", "text": "閒得發慌的時候，就閒得理直氣壯", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0104", "text": "我這叫順其自然，自然就是不想動", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0105", "text": "今天什麼都沒做，但我做得很開心", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0106", "text": "我不是在拖延，是在尊重事情的順序", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0107", "text": "躺平不是輸，是換個角度看天花板", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0108", "text": "我把懶散練成了一種風格", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0109", "text": "先發個呆，等等再決定要不要繼續發呆", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0110", "text": "我這姿勢叫節能模式，環保的", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0111", "text": "事情急不急，我說了算", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0112", "text": "我不動，是因為動了會破壞這份寧靜", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0113", "text": "今天我只負責呼吸，其他的明天再說", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0114", "text": "我把空閒安排得明明白白：什麼都不排", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0115", "text": "無所事事，事事都不需要我", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0116", "text": "我這叫休養生息，重點在息", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0117", "text": "能放著的就放著，這是我的人生哲學", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0118", "text": "我發呆的時候最有生產力，生產空氣", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0119", "text": "今天不適合努力，明天也看狀況", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0120", "text": "我把時間浪費得很有品味", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0121", "text": "坐著不動，是對這張椅子的尊重", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0122", "text": "我不是沒效率，是把效率用在休息上", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0123", "text": "閒人不問忙人事，我連自己的都懶得問", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0124", "text": "我這不是混日子，是把日子過得很鬆", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0125", "text": "今天的我很完整，因為什麼都沒缺也沒做", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0126", "text": "我把腦袋關機，省得它又想東想西", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0127", "text": "慢慢來，反正也沒人在等", "meta": "AI · 知足", "tags": ["知足"], "url": ""}, {"id": "q0128", "text": "假裝在開會，其實在心裡開趴。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0129", "text": "我打字很大聲，是要讓他們以為我很忙。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0130", "text": "老闆走過來我就 Alt+Tab，這是我唯一的快捷鍵肌肉記憶。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0131", "text": "薪水照領，靈魂早退。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0132", "text": "我不是在發呆，我是在用很慢的速度思考要不要做事。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0133", "text": "今天的進度條卡在 0%，但我的咖啡進度條 100%。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0134", "text": "我把待辦清單也當成一種裝飾。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0135", "text": "被抓到摸魚的時候，我都假裝是在等程式跑。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0136", "text": "我的效率跟我的減肥計畫一樣，永遠明天開始。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0137", "text": "上班這麼累，當然要先休息一下再開始。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0138", "text": "我盯著螢幕的眼神很認真，認真在想中午吃什麼。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0139", "text": "老闆以為我在 loading，其實我整個人都在 loading。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0140", "text": "我不是不做事，我是在醞釀一個不做事的好理由。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0141", "text": "忙到沒時間摸魚，是我這輩子最大的恐懼。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0142", "text": "我的工作熱情，跟手機電量一樣，早上滿格中午剩 20%。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0143", "text": "開了八個視窗，七個是私事，一個拿來擋。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0144", "text": "我每天最有產能的時刻，是在想怎麼偷懶。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0145", "text": "假裝認真記筆記，其實在畫小烏龜。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0146", "text": "老闆問我做完沒，我說快了，這個快字我用了三天。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0147", "text": "我的薪水是辛苦費，辛苦在於要裝忙。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0148", "text": "我不是慢，我是在用一種很有藝術感的節奏工作。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0149", "text": "今天又成功用一杯咖啡的時間，喝完一杯咖啡。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0150", "text": "摸魚被抓包，我的反應比工作反應快多了。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0151", "text": "我把 Email 標成未讀，假裝自己還沒看到人生。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0152", "text": "我上班最大的成就，是讓他們相信我有在上班。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0153", "text": "老闆走了我就活了，老闆來了我就 buffer。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0154", "text": "我不是在划水，我是在水裡冥想。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0155", "text": "我的腦袋已經下班了，身體還在加班幫忙撐場面。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0156", "text": "認真工作會累，認真摸魚反而很有精神。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0157", "text": "我假裝在找資料，找了一個下午的網拍。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0158", "text": "我把工作群組設靜音，這樣良心就不會響。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0159", "text": "主管說相信我，他不知道這是他這週最大的失誤。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0160", "text": "我每天準時上班，準時開始摸魚。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0161", "text": "忙是一種姿態，閒才是我的本質。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0162", "text": "我的工作能力深不可測，因為從來沒人測過。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0163", "text": "摸魚摸到一半被叫，我整個人像被拔掉電源。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0164", "text": "我假裝很投入，投入在思考要不要請假。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0165", "text": "老闆誇我穩定，我穩定地一事無成。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0166", "text": "我手上的滑鼠在動，腦子裡的我已經躺平。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0167", "text": "我不是在偷懶，我是在替公司省下我的勞動力。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0168", "text": "我把上廁所的時間延長，這是我一天最自由的十分鐘。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0169", "text": "開視訊我關鏡頭，這樣就沒人知道我在嗑零食。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0170", "text": "我的待辦事項排得很整齊，整齊地擺在那邊沒動。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0171", "text": "被問進度的時候，我的腦袋比 Wi-Fi 還容易斷線。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0172", "text": "我假裝在思考策略，其實在想等等要不要團購。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0173", "text": "今天又是充實的一天，充實地什麼都沒做。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0174", "text": "我打開 Excel 是為了讓螢幕看起來像個正經人。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0175", "text": "老闆以為我在跑數字，我在跑捷運末班車的時刻表。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0176", "text": "我最大的工作技能，是切換視窗的速度。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0177", "text": "領的是全薪，出的是半力，賺到的是良心折扣。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0178", "text": "我假裝皺眉很煩惱，其實在想晚餐配哪部劇。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0179", "text": "上班八小時，我有效工作大概等於一支廣告的長度。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0180", "text": "我不是在拖，我是在給靈感一點空間。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0181", "text": "主管看我的眼神充滿信任，我看他充滿歉意。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0182", "text": "我把手機藏在抽屜，假裝我跟它已經分手。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0183", "text": "今天進度零，但我心情十分，整體還是很 OK。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0184", "text": "我假裝在回客戶，其實在回我朋友的限動。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0185", "text": "摸魚被發現的瞬間，我演技直接拿金馬獎。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0186", "text": "我上班的核心精神，是用最少的力氣撐到下班。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0187", "text": "老闆問我在忙嗎，我說超忙，忙著裝忙。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0188", "text": "我的鍵盤很乾淨，因為大部分時間我都在滑手機。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0189", "text": "我把會議當成合法發呆的時間，效果拔群。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0190", "text": "我不是在偷時間，我是在跟公司借一點。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0191", "text": "認真起來連我自己都怕，所以我都不太認真。", "meta": "AI · 自嘲", "tags": ["自嘲"], "url": ""}, {"id": "q0192", "text": "我每天打卡上班，靈魂打卡下班。", "meta": "AI · 自嘲",
