let voter=localStorage.getItem("moyu_voter")||"";
let picks=JSON.parse(localStorage.getItem("moyu_fishv2_picks")||"{}"); // fish_id -> tile id | "none"
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("moyu_fishv2_picks",JSON.stringify(picks));}
function counts(){
  const c={};let n=0;
  for(const [fid,t] of Object.entries(picks)){ n++; const it=ITEMS.find(i=>i.id===fid); if(!it) continue;
    const st = t==="none"?"none":(it.tiles.find(x=>x.id===t)||{}).style; c[st]=(c[st]||0)+1; }
  $("done").textContent=n+"/"+ITEMS.length;
  const lab={v1:"現在v1",guofeng:"國風",chalkpastel:"粉彩",airbrush:"噴槍",none:"都不行"};
  $("tally").innerHTML=Object.entries(lab).map(([k,v])=>`<span class="st">${v} <b>${c[k]||0}</b></span>`).join("");
}
async function post(fid,tile){
  if(!API) return;
  const it=ITEMS.find(i=>i.id===fid);
  const rec={ts:Date.now(),voter,type:"fishv2_pick",image:fid,winner:tile,loser:"",pair:it.tiles.map(t=>t.id)};
  try{ await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)}); }catch(e){}
}
function pick(fid,tile){
  picks[fid]=tile; save(); render(); counts(); post(fid,tile);
}
function render(){
  const root=$("list"); root.innerHTML="";
  for(const it of ITEMS){
    const div=document.createElement("div"); div.className="fish";
    const p=picks[it.id];
    if(!it.ready) div.classList.add("wip");
    div.innerHTML=`<div class="h"><b>${it.name}</b>${it.ready?"":"<span class='r' style='background:#ffe9c7'>生成中，先別選</span>"}<span class="r">${it.rarity_zh}</span><span class="d">「${it.desc}」</span></div>
      <div class="tiles">${it.tiles.map(t=>`<div class="tile ${p===t.id?'picked':''}" data-f="${it.id}" data-t="${t.id}">
        <img src="${t.file}" loading="lazy" alt=""><span class="zoom" data-src="${t.file}">放大</span><div class="l">${t.label}</div></div>`).join("")}</div>
      <span class="none ${p==='none'?'picked':''}" data-f="${it.id}">都不行 / 這條魚哪張都沒感覺</span>`;
    root.appendChild(div);
  }
  root.querySelectorAll(".tile").forEach(el=>el.addEventListener("click",e=>{
    if(e.target.classList.contains("zoom")){ $("mimg").src=e.target.dataset.src; $("modal").classList.add("show"); return; }
    const it=ITEMS.find(i=>i.id===el.dataset.f); if(!it.ready) return;
    pick(el.dataset.f, el.dataset.t);
  }));
  root.querySelectorAll(".none").forEach(el=>el.addEventListener("click",()=>{ const it=ITEMS.find(i=>i.id===el.dataset.f); if(it.ready) pick(el.dataset.f,"none"); }));
  const nr=ITEMS.filter(i=>i.ready).length; $("ready").textContent=nr+"/"+ITEMS.length;
}
$("modal").addEventListener("click",()=>$("modal").classList.remove("show"));
$("nameOk").onclick=()=>{ voter=($("nameInput").value.trim())||("匿名"+Math.floor(Math.random()*1000)); localStorage.setItem("moyu_voter",voter); $("name").classList.remove("show"); };
if(!voter){ $("name").classList.add("show"); }
render(); counts();
</script>
